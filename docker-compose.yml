services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    # watch only the source packages: uvicorn's StatReload (watchfiles isn't installed, so --reload-exclude does
    # nothing) otherwise walks every file under /app each second, including a local backend/.venv (~10K files)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /app/predictions --reload-dir /app/external"
    volumes:
      - ./backend:/app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROPLINE_API_KEY: ${PROPLINE_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}

  frontend:
    build: ./vite-frontend
    container_name: react_frontend
    restart: always
    command: npm run dev -- --host
    volumes:
      - ./vite-frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: http://localhost:8002
    depends_on:
      - backend
